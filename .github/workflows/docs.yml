name: Documentation
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - main
# Least privilege: pull request builds get read-only access. Only the deploy
# job, which never runs for pull requests, can write to GitHub Pages.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: page dates come from git
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install zensical
      - name: Add last-updated dates to front matter
        run: python scripts/freshness.py frontmatter
      - run: zensical build --clean
      - name: Add lastmod to sitemap
        run: python scripts/freshness.py sitemap
      - name: Version extra.css and extra.js URLs
        run: python scripts/version_assets.py
      - name: Shrink search index
        run: python scripts/slim_search_index.py
      - name: Check published URLs still resolve
        run: python scripts/check_urls.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Check every Mermaid diagram parses
        run: |
          npm ci --prefix scripts --no-fund --no-audit
          node scripts/check_diagrams.mjs

  deploy:
    if: github.event_name == 'push'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: page dates come from git
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install zensical
      - name: Add last-updated dates to front matter
        run: python scripts/freshness.py frontmatter
      - run: zensical build --clean
      - name: Add lastmod to sitemap
        run: python scripts/freshness.py sitemap
      - name: Version extra.css and extra.js URLs
        run: python scripts/version_assets.py
      - name: Shrink search index
        run: python scripts/slim_search_index.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
