[project]
site_name = "Compute Central"
site_description = "Practical DevOps, cloud, Kubernetes, automation, AI engineering, and SRE guides for real-world infrastructure work."
site_author = "Sameer Alam"
site_url = "https://computecentral.in/"
repo_url = "https://github.com/sameeralam3127/compute-central-docs"
repo_name = "Compute Central Docs"
edit_uri = "edit/main/docs"

copyright = """
Copyright © 2016–2026 Sameer Alam · <a href="#__consent">Cookie settings</a>
"""

extra_css = ["stylesheets/extra.css"]

# Keep Zensical's recommended extension set explicit. Adding one extension table
# disables the implicit defaults, so `meta` is included to strip Markdown front matter.
[project.markdown_extensions.meta]
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[project.theme]
language = "en"
favicon = "assets/logo.png"
logo = "assets/logo.png"
custom_dir = "overrides"

features = [
  "announce.dismiss",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow",
  "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/smile"
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sameeralam3127/compute-central-docs"
name = "Compute Central on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://computecentral.in/"
name = "Compute Central website"

[project.extra.analytics]
provider = "google"
property = "G-TBKH2M5SJ3"

[project.extra.analytics.feedback]
title = "Was this page helpful?"

[[project.extra.analytics.feedback.ratings]]
icon = "material/thumb-up-outline"
name = "This page was helpful"
data = 1
note = "Thanks for your feedback!"

[[project.extra.analytics.feedback.ratings]]
icon = "material/thumb-down-outline"
name = "This page could be improved"
data = 0
note = """
  Thanks for your feedback! Help us improve this page by
  <a href="https://github.com/sameeralam3127/compute-central-docs/issues/new?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">opening a feedback issue</a>.
"""

[project.extra.consent]
title = "Cookie consent"
description = """
  We use optional analytics cookies to understand repeated visits, improve this
  documentation, and learn whether readers find what they are looking for.
  You can change your choice at any time using the Cookie settings link below.
"""
actions = ["accept", "reject", "manage"]

[project.extra.consent.cookies.analytics]
name = "Google Analytics"
checked = false

# Explicit navigation. Each top-level section is one array-of-tables entry so
# that footer prev/next links stay a deliberate, curated handoff between
# sections instead of falling out of alphabetical directory order.

[[project.nav]]
"Compute Central" = "index.md"

