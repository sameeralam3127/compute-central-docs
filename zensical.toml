[[project.extra.analytics.feedback.ratings]]
icon = "material/thumb-down-outline"
name = "This page could be improved"
data = 0
note = "Thanks for your feedback! It helps improve this page."

[project.extra.consent]
title = "Cookie consent"
description = """
  We use optional analytics cookies to understand repeated visits, improve this
  documentation, and learn whether readers find what they are looking for.
  This site also shows ads, and Google may set advertising cookies — readers in
  the EEA, the UK, and Switzerland get Google's own consent message for those.
  You can change your choice at any time using the Cookie settings link below,
  and the Privacy Policy explains every cookie in use.
"""
actions = ["accept", "reject", "manage"]

[project.extra.consent.cookies.analytics]
name = "Google Analytics"
checked = false

# Old URLs that search engines and other sites may still link to. Each old page
# becomes a small HTML page that sends readers (and search engines) to the new
# one. scripts/check_urls.py fails the build if a published URL disappears
# without an entry here, so move pages only when you have to.
